<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NOI 板子库</title>
  <style>
    :root{--bg:#f5f7fb;--card:#fff;--text:#1f2937;--muted:#6b7280;--line:#e5e7eb;--brand:#3b82f6}
    *{box-sizing:border-box} body{margin:0;font-family:"Segoe UI",Arial,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text)}
    .wrap{max-width:1100px;margin:0 auto;padding:20px}
    .top{background:var(--card);border:1px solid var(--line);padding:14px 16px;border-radius:10px;position:sticky;top:10px;z-index:1}
    h1{font-size:22px;margin:0 0 6px} .desc{color:var(--muted);font-size:14px}
    .layout{display:grid;grid-template-columns:240px 1fr;gap:16px;margin-top:16px}
    .nav,.main{background:var(--card);border:1px solid var(--line);border-radius:10px}
    .nav{padding:12px;position:sticky;top:96px;height:fit-content}
    .nav a{display:block;padding:8px 10px;border-radius:6px;color:#111827;text-decoration:none}
    .nav a:hover{background:#eff6ff;color:#1d4ed8}
    .main{padding:16px}
    .section{padding:8px 0 18px;border-bottom:1px solid var(--line)}
    .section:last-child{border-bottom:none}
    .section h2{font-size:20px;margin:8px 0}
    .algo{border:1px solid var(--line);border-radius:8px;padding:12px;margin:10px 0;background:#fcfcfd}
    .algo-title{font-weight:700}
    .comments{margin-top:8px}
    .comment{border-left:3px solid var(--brand);padding:8px 10px;background:#f8fbff;margin-top:8px;border-radius:4px}
    .comment .user{font-weight:600;font-size:13px}
    .comment .meta{font-size:12px;color:var(--muted)}
    .empty{font-size:13px;color:var(--muted)}
    @media (max-width:880px){.layout{grid-template-columns:1fr}.nav{position:static}}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="top">
      <h1>NOI 板子库（OI-wiki 风格评论区）</h1>
      <div class="desc">每个算法小板块只保留“评论区”概念：评论即用户发布的板子。</div>
    </div>

    <div class="layout">
      <aside class="nav" id="nav"></aside>
      <main class="main" id="main"></main>
    </div>
  </div>

  <script>
    const data = [
      { section: '基础', items: [
        { name: '二分', comments:[
          { user:'alice', title:'标准 lower_bound 板子', link:'../templates/basic/binary_search/README.md', time:'2026-02-05' }
        ]},
        { name: '前缀和 / 差分', comments:[] },
        { name: '双指针', comments:[] }
      ]},
      { section: '数据结构', items: [
        { name: '并查集', comments:[] }, { name: '树状数组', comments:[] }, { name: '线段树（含懒标记）', comments:[] }, { name: 'Trie', comments:[] }
      ]},
      { section: '图论', items: [
        { name:'BFS / DFS', comments:[] }, { name:'最短路', comments:[] }, { name:'最小生成树', comments:[] }
      ]},
      { section: '数学', items: [
        { name:'快速幂', comments:[] }, { name:'扩展欧几里得', comments:[] }
      ]},
      { section: '字符串', items: [
        { name:'KMP', comments:[] }, { name:'哈希', comments:[] }
      ]}
    ];

    const nav = document.getElementById('nav');
    const main = document.getElementById('main');

    data.forEach((sec, idx) => {
      const id = `sec-${idx}`;
      const a = document.createElement('a');
      a.href = `#${id}`;
      a.textContent = sec.section;
      nav.appendChild(a);

      const section = document.createElement('section');
      section.className = 'section';
      section.id = id;
      section.innerHTML = `<h2>${sec.section}</h2>`;

      sec.items.forEach(item => {
        const algo = document.createElement('div');
        algo.className = 'algo';

        const title = document.createElement('div');
        title.className = 'algo-title';
        title.textContent = item.name;
        algo.appendChild(title);

        const comments = document.createElement('div');
        comments.className = 'comments';
        if (!item.comments.length) {
          comments.innerHTML = '<div class="empty">暂无用户板子（评论）</div>';
        } else {
          item.comments.forEach(c => {
            const card = document.createElement('div');
            card.className = 'comment';
            card.innerHTML = `<div class="user">${c.user}</div><div><a href="${c.link}">${c.title}</a></div><div class="meta">${c.time}</div>`;
            comments.appendChild(card);
          });
        }
        algo.appendChild(comments);
        section.appendChild(algo);
      });

      main.appendChild(section);
    });
  </script>
</body>
</html>
