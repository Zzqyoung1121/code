<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>信竞板子本地库</title>
  <style>
    body{margin:0;background:#f5f5f5;font-family:'Segoe UI','Microsoft YaHei',sans-serif}
    .container{max-width:1200px;margin:0 auto;padding:16px}
    .navbar{background:#2c3e50;color:#fff;padding:14px 16px;border-radius:8px;margin-bottom:16px;font-weight:700;font-size:22px}
    .panel{background:#fff;border-radius:8px;box-shadow:0 2px 10px rgba(0,0,0,.08);padding:16px;margin-bottom:14px}
    .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
    .input{padding:10px 12px;border:1px solid #ddd;border-radius:6px;font-size:14px}
    .grow{flex:1}
    .btn{border:1px solid #ddd;background:#fff;border-radius:6px;padding:8px 12px;cursor:pointer}
    .btn.primary{background:#0d6efd;color:#fff;border-color:#0d6efd}
    .btn.success{background:#198754;color:#fff;border-color:#198754}
    .btn.warning{background:#ffc107;color:#222;border-color:#ffc107}
    .btn:hover{filter:brightness(.96)}
    .badge{display:inline-block;background:#e9ecef;border-radius:14px;padding:2px 10px;margin-right:6px;font-size:12px}
    .card{background:#fff;border-radius:8px;box-shadow:0 1px 5px rgba(0,0,0,.1);padding:16px;margin-bottom:12px}
    .title{font-size:20px;font-weight:700;color:#0d6efd}
    .muted{color:#666;font-size:13px}
    .snippet-content{max-height:120px;overflow:hidden;position:relative;line-height:1.65}
    .snippet-content:after{content:'';position:absolute;left:0;right:0;bottom:0;height:28px;background:linear-gradient(to bottom,rgba(255,255,255,0),#fff)}
    .hidden{display:none}
    .editor-wrap{display:grid;grid-template-columns:1fr 1fr;gap:8px}
    textarea{width:100%;min-height:380px;resize:vertical;padding:12px;border:1px solid #ddd;border-radius:6px;font-family:Consolas,monospace}
    .preview{min-height:380px;border:1px solid #ddd;border-radius:6px;padding:12px;background:#fff;overflow:auto}
    .section-title{font-size:22px;font-weight:700;margin:8px 0 14px}
    .toolbar button{margin-right:6px}
    .tabs{display:flex;gap:8px;flex-wrap:wrap}
    .tab{border:1px solid #ddd;border-radius:14px;padding:4px 12px;cursor:pointer;background:#fff}
    .tab.active{background:#0d6efd;color:#fff;border-color:#0d6efd}
    pre{background:#f6f8fa;padding:12px;border-radius:6px;overflow:auto}
    code{font-family:Consolas,monospace}
    @media (max-width:900px){.editor-wrap{grid-template-columns:1fr}}
  </style>
</head>
<body>
<div class="container">
  <div class="navbar">信竞板子本地库（OI-wiki 分类）</div>

  <div id="mainPage">
    <div class="panel">
      <div class="row">
        <input id="searchInput" class="input grow" placeholder="搜索标题/标签/内容..." />
        <button class="btn primary" onclick="searchSnippets()">搜索</button>
      </div>
      <div class="row" style="margin-top:10px">
        <select id="categoryFilter" class="input" onchange="renderSnippetsList()"></select>
        <button class="btn" onclick="setSort('time')">最新</button>
        <button class="btn" onclick="setSort('likes')">最热</button>
        <button class="btn warning" onclick="importJson()">导入JSON</button>
        <button class="btn" onclick="exportJson()">导出JSON</button>
        <button class="btn success" onclick="showEditPage()">添加新板子</button>
      </div>
      <div class="tabs" id="categoryTabs" style="margin-top:10px"></div>
    </div>

    <div class="section-title" id="pageTitle">所有板子</div>
    <div id="snippetsList"></div>
  </div>

  <div id="editPage" class="hidden">
    <div class="panel">
      <div class="row" style="justify-content:space-between">
        <div class="section-title" id="editTitle">添加新板子</div>
        <button class="btn" onclick="showMainPage()">返回</button>
      </div>
      <div class="row">
        <input id="snippetTitle" class="input grow" placeholder="标题*" />
        <input id="snippetTags" class="input grow" placeholder="标签，逗号分隔" />
      </div>
      <div class="row" style="margin-top:10px">
        <select id="snippetCategory" class="input"></select>
        <select id="snippetOid" class="input grow"></select>
      </div>
      <div class="toolbar" style="margin-top:10px">
        <button class="btn" onclick="insertText('**加粗**')">加粗</button>
        <button class="btn" onclick="insertText('*斜体*')">斜体</button>
        <button class="btn" onclick="insertText('## 标题')">标题</button>
        <button class="btn" onclick="insertText('```cpp\n\n```')">代码块</button>
        <button class="btn" onclick="insertText('$公式$')">行内公式</button>
      </div>
      <div class="editor-wrap" style="margin-top:10px">
        <textarea id="editor" placeholder="Markdown 内容*"></textarea>
        <div id="preview" class="preview"></div>
      </div>
      <div class="row" style="justify-content:flex-end;margin-top:10px">
        <button class="btn success" onclick="saveSnippet()">保存</button>
      </div>
    </div>
  </div>

  <div id="viewPage" class="hidden">
    <div class="panel">
      <div class="row" style="justify-content:space-between">
        <div class="section-title" id="viewTitle"></div>
        <button class="btn" onclick="showMainPage()">返回</button>
      </div>
      <div class="row" id="viewMeta"></div>
      <div class="row" style="justify-content:space-between;margin:8px 0">
        <div class="muted" id="viewTime"></div>
        <div>
          <button class="btn" id="editBtn">编辑</button>
          <button class="btn" id="delBtn">删除</button>
        </div>
      </div>
      <div id="viewContent"></div>
    </div>
  </div>
</div>

<input type="file" id="importInput" accept=".json" class="hidden" />

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css" crossorigin="anonymous">
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js" crossorigin="anonymous"></script>
<script>
let snippetsDB = JSON.parse(localStorage.getItem('snippetsDB') || '[]');
let catalog = [];
let categories = [];
let currentSort = 'time';
let currentId = null;
let activeCategory = 'all';

async function init(){
  try {
    catalog = await (await fetch('./catalog.json', {cache:'no-store'})).json();
  } catch {
    catalog = [];
  }
  categories = catalog.map(x => x.section);
  if (!categories.length) categories = ['basic','ds','graph','math','string'];
  renderCategorySelectors();
  bindEvents();
  renderSnippetsList();
  updatePreview();
}

function renderCategorySelectors(){
  const f = document.getElementById('categoryFilter');
  f.innerHTML = `<option value="all">全部分类</option>` + categories.map(c=>`<option value="${c}">${c}</option>`).join('');
  const s = document.getElementById('snippetCategory');
  s.innerHTML = categories.map(c=>`<option value="${c}">${c}</option>`).join('');
  s.onchange = refreshOidOptions;
  refreshOidOptions();
  const tabs = document.getElementById('categoryTabs');
  tabs.innerHTML = `<span class="tab active" data-v="all" onclick="switchCategory('all',this)">全部</span>` +
    categories.map(c=>`<span class="tab" data-v="${c}" onclick="switchCategory('${c}',this)">${c}</span>`).join('');
}

function switchCategory(c, el){
  activeCategory = c;
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
  el.classList.add('active');
  document.getElementById('categoryFilter').value = c;
  renderSnippetsList();
}

function refreshOidOptions(){
  const cat = document.getElementById('snippetCategory').value;
  const sec = catalog.find(x=>x.section===cat);
  const opts = (sec?.items || []).map(i=>`<option value="${i.oid}">${i.title}</option>`).join('');
  document.getElementById('snippetOid').innerHTML = opts || '<option value="">(无)</option>';
}

function bindEvents(){
  document.getElementById('searchInput').addEventListener('keypress', e=>{if(e.key==='Enter') searchSnippets();});
  document.getElementById('editor').addEventListener('input', updatePreview);
  document.getElementById('importInput').addEventListener('change', e=>readImport(e.target.files[0]));
}

function showPage(id){['mainPage','editPage','viewPage'].forEach(x=>document.getElementById(x).classList.add('hidden'));document.getElementById(id).classList.remove('hidden');}
function showMainPage(){showPage('mainPage');renderSnippetsList();}
function showEditPage(){
  currentId = null;
  document.getElementById('editTitle').textContent='添加新板子';
  ['snippetTitle','snippetTags','editor'].forEach(id=>document.getElementById(id).value='');
  document.getElementById('snippetCategory').value = categories[0] || 'basic';
  refreshOidOptions();
  updatePreview();
  showPage('editPage');
}

function insertText(t){const e=document.getElementById('editor');const s=e.selectionStart, n=e.selectionEnd; e.value=e.value.slice(0,s)+t+e.value.slice(n); e.focus(); e.selectionStart=e.selectionEnd=s+t.length; updatePreview();}
function updatePreview(){const el=document.getElementById('preview'); el.innerHTML=marked.parse(document.getElementById('editor').value||''); renderMathInElement(el,{delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}],throwOnError:false});}

function setSort(t){currentSort=t;renderSnippetsList();}
function searchSnippets(){renderSnippetsList(document.getElementById('searchInput').value.trim().toLowerCase());}

function renderSnippetsList(keyword=''){
  const filterCat = document.getElementById('categoryFilter').value || activeCategory;
  let arr = snippetsDB.filter(s => {
    const catOk = (filterCat==='all') || s.category===filterCat;
    const kwOk = !keyword || [s.title, s.content, (s.tags||[]).join(',')].join('\n').toLowerCase().includes(keyword);
    return catOk && kwOk;
  });
  arr.sort((a,b)=> currentSort==='likes' ? (b.likes||0)-(a.likes||0) : new Date(b.createdAt)-new Date(a.createdAt));
  document.getElementById('pageTitle').textContent = keyword ? `搜索结果：${keyword}` : '所有板子';
  const box = document.getElementById('snippetsList');
  if(!arr.length){box.innerHTML='<div class="panel">暂无板子</div>';return;}
  box.innerHTML = arr.map(s=>`
    <div class="card">
      <div class="title">${esc(s.title)}</div>
      <div style="margin:6px 0"><span class="badge">${esc(s.category||'uncategorized')}</span><span class="badge">${esc(s.oid||'无算法条目')}</span>${(s.tags||[]).map(t=>`<span class='badge'>${esc(t)}</span>`).join('')}</div>
      <div class="muted">${fmt(s.createdAt)} · 点赞 ${s.likes||0}</div>
      <div class="snippet-content">${marked.parse(s.content||'')}</div>
      <div class="row" style="justify-content:flex-end;margin-top:8px"><button class="btn primary" onclick="viewSnippet('${s.id}')">查看详情</button></div>
    </div>`).join('');
  renderMathInElement(box,{delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}],throwOnError:false});
}

function viewSnippet(id){
  const s = snippetsDB.find(x=>x.id===id); if(!s) return;
  currentId=id;
  document.getElementById('viewTitle').textContent=s.title;
  document.getElementById('viewMeta').innerHTML=`<span class='badge'>${esc(s.category||'')}</span><span class='badge'>${esc(s.oid||'')}</span>${(s.tags||[]).map(t=>`<span class='badge'>${esc(t)}</span>`).join('')}`;
  document.getElementById('viewTime').textContent='发布于 '+fmt(s.createdAt);
  document.getElementById('viewContent').innerHTML=marked.parse(s.content||'');
  renderMathInElement(document.getElementById('viewContent'),{delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}],throwOnError:false});
  document.getElementById('editBtn').onclick=()=>editSnippet(id);
  document.getElementById('delBtn').onclick=()=>{if(confirm('确认删除？')){snippetsDB=snippetsDB.filter(x=>x.id!==id);save();showMainPage();}};
  showPage('viewPage');
}

function editSnippet(id){
  const s=snippetsDB.find(x=>x.id===id); if(!s) return;
  currentId=id;
  document.getElementById('editTitle').textContent='编辑板子';
  document.getElementById('snippetTitle').value=s.title;
  document.getElementById('snippetTags').value=(s.tags||[]).join(',');
  document.getElementById('editor').value=s.content||'';
  document.getElementById('snippetCategory').value=s.category || categories[0];
  refreshOidOptions();
  document.getElementById('snippetOid').value=s.oid||'';
  updatePreview();
  showPage('editPage');
}

function saveSnippet(){
  const title=document.getElementById('snippetTitle').value.trim();
  const content=document.getElementById('editor').value.trim();
  if(!title||!content){alert('标题和内容必填');return;}
  const now=new Date().toISOString();
  const item={
    id: currentId || uid(),
    title,
    tags: document.getElementById('snippetTags').value.split(',').map(x=>x.trim()).filter(Boolean),
    category: document.getElementById('snippetCategory').value,
    oid: document.getElementById('snippetOid').value,
    content,
    likes: currentId ? (snippetsDB.find(x=>x.id===currentId)?.likes||0) : 0,
    createdAt: currentId ? (snippetsDB.find(x=>x.id===currentId)?.createdAt||now) : now,
    updatedAt: now
  };
  snippetsDB = currentId ? snippetsDB.map(x=>x.id===currentId?item:x) : [item,...snippetsDB];
  save(); showMainPage();
}

function exportJson(){
  const data={platform:'oj-snippet-local',exportTime:new Date().toISOString(),snippets:snippetsDB};
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json;charset=utf-8'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='snippets-export.json'; a.click(); URL.revokeObjectURL(a.href);
}
function importJson(){document.getElementById('importInput').click();}
function readImport(file){
  if(!file) return;
  const fr=new FileReader();
  fr.onload=()=>{
    try{
      const data=JSON.parse(fr.result);
      if(!Array.isArray(data.snippets)) throw new Error('缺少snippets数组');
      const incoming=data.snippets.map(s=>({id:uid(),title:s.title||'未命名',tags:s.tags||[],category:s.category||categories[0],oid:s.oid||'',content:s.content||'',likes:s.likes||0,createdAt:s.createdAt||new Date().toISOString(),updatedAt:new Date().toISOString()}));
      snippetsDB=[...incoming,...snippetsDB]; save(); renderSnippetsList(); alert('导入成功：'+incoming.length+' 条');
    }catch(e){alert('导入失败：'+e.message)}
  };
  fr.readAsText(file,'utf-8');
  document.getElementById('importInput').value='';
}

function save(){localStorage.setItem('snippetsDB',JSON.stringify(snippetsDB));}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2)}
function fmt(t){return new Date(t).toLocaleString()}
function esc(s){return String(s||'').replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m]))}

init();
</script>
</body>
</html>
